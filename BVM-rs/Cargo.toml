[package]
name = "BVM"
version = "0.1.0"
description = "Reference assembler for the BROT ISA" 
rust-version = "1.85"
edition = "2024"

[dependencies]
arbitrary-int = "2.2.0"
clap = { version = "4.6.7", features = ["derive"] }
fixed = "1.30.0"
isa = { version = "0.1.0", path = "../isa-rs" }
num_enum = "0.7"

[profile.release]
lto = true
codegen-units =  1
strip = true
